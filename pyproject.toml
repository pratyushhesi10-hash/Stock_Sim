[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonk-paper-agent"
version = "0.1.0"
description = "Reproducible research and backtesting for a paper-only trading agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]
paper = ["alpaca-py>=0.30,<1"]
research = ["hmmlearn>=0.3,<1", "statsmodels>=0.14,<1", "scipy>=1.12,<2"]
rl = ["stable-baselines3>=2.4,<3", "gymnasium>=1,<2"]
dashboard = ["streamlit>=1.40,<2"]

[project.scripts]
stonk = "stonk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
